[package]
name = "searlx-engine-linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "WebKitGTK engine backend for searlx (experimental)."

[dependencies]
searlx-core.workspace = true
searlx-engine.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
cairo-rs = { version = "0.22", features = ["png"] }
glib = "0.22"
gtk = "0.19"
webkit2gtk = { version = "3.0", features = ["v2_40"] }

[[bin]]
name = "searlx-spike-linux"
path = "src/bin/spike.rs"

[[bin]]
name = "searlx-bench-linux"
path = "src/bin/bench.rs"

[[bin]]
name = "searlx-interactions-linux"
path = "src/bin/interactions.rs"

[lints]
workspace = true
