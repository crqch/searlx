[workspace]
resolver = "3"
members = [
    "apps/searlx",
    "crates/searlx-core",
    "crates/searlx-engine",
    "crates/searlx-engine-macos",
    "crates/searlx-engine-windows",
    "crates/searlx-engine-linux",
    "crates/searlx-platform",
    "crates/searlx-testkit",
    "crates/searlx-ui",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-or-later"
authors = ["searlx contributors"]
repository = "https://github.com/driceroland/searlx"
description = "Search for Linux — a small, quiet browser built on system web engines."

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3.0"

searlx-core = { path = "crates/searlx-core" }
searlx-engine = { path = "crates/searlx-engine" }
searlx-engine-macos = { path = "crates/searlx-engine-macos" }
searlx-engine-windows = { path = "crates/searlx-engine-windows" }
searlx-engine-linux = { path = "crates/searlx-engine-linux" }
searlx-platform = { path = "crates/searlx-platform" }
searlx-testkit = { path = "crates/searlx-testkit" }
searlx-ui = { path = "crates/searlx-ui" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# zed-async-tar 0.5 depends on xattr 0.2, whose ENOATTR alias no longer
# compiles against current libc on Linux. The vendored copy differs only in
# that constant: Linux uses ENODATA, the native spelling of the same errno.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
